[project]
name = "car-support"
version = "0.1.0"
description = "Customer-support assistant for a car maker: grounded RAG answers with citations, tools and human handoff."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow "›" and other typographic characters in text

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (real Postgres via testcontainers)"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]
