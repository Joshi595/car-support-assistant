# Metadata for every document under brand/ and public/.
#
# Path convention: <source_type>/<market>/<language>/<file>, where market "global" means all markets.
# Everything derivable from the path is derived; this file only holds what the path cannot say.
# Per-document entries override the defaults of their source type.

[defaults.brand]
licence = "Fictional sample data, MIT (this repository)"
valid_from = 2026-01-01

[defaults.public]
licence = "OGL-3.0"
attribution = "Contains public sector information licensed under the Open Government Licence v3.0."
valid_from = 2026-10-19  # snapshot date (data/scripts/fetch_public.py)

# ── Brand: versioned documents ─────────────────────────────────────────────
# Two files share one doc_id; retrieval keeps the version valid on the query date.
[docs."brand/uk/en/charging-tariffs-2027.md"]
doc_id = "brand/uk/en/charging-tariffs"
valid_from = 2027-01-01

