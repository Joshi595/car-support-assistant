# Local stack. `docker compose up -d` starts Postgres; add `--profile ollama` if Ollama is not installed on the host.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: car_support
      POSTGRES_PASSWORD: car_support
      POSTGRES_DB: car_support
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_support"]
      interval: 5s
      retries: 10

  ollama:
    profiles: [ollama]
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 10

  ollama-pull:  # one-shot job: download the models the app needs
    profiles: [ollama]
    image: ollama/ollama
    environment: [OLLAMA_HOST=ollama:11434]
    entrypoint: ["sh", "-c", "ollama pull qwen3-embedding:4b && ollama pull gemma3:4b"]
    depends_on:
      ollama: {condition: service_healthy}

  # ── Observability (docker compose --profile observability up -d) ─────────────
  phoenix:  # traces: set CS_TRACING_ENDPOINT=http://127.0.0.1:6006/v1/traces, UI on http://127.0.0.1:6006
    profiles: [observability]
    image: arizephoenix/phoenix:20.23.0
    ports: ["6006:6006"]
    volumes: [phoenix:/mnt/data]
    environment: [PHOENIX_WORKING_DIR=/mnt/data]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    ports: ["9090:9090"]
    volumes: [./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    extra_hosts: ["host.docker.internal:host-gateway"]  # the API on the host during development

  grafana:  # dashboards on http://127.0.0.1:3001 (anonymous read-only viewer for local use)
    profiles: [observability]
    image: grafana/grafana-oss:13.0.2
    ports: ["3001:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/car-support.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  ollama:
  phoenix:
